# Install once per clone:  pip install pre-commit && pre-commit install
# Blocks a commit that contains a secret, a private key, a huge file, or a high-severity Bandit finding.
# This protects the REPOSITORY. It cannot stop a secret being pasted into Copilot/ChatGPT chat:
# see docs/section-1b.md for the controls that cover that case.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll", "-r", "lab"]
        files: ^lab/
