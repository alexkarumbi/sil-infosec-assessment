# Secure delivery pipeline for the SIL assessment lab.
#   Every PR    : secrets, SAST, SCA (+ hallucinated-package check), unit tests, ZAP baseline (passive)
#   main/nightly: the above + integration tests + ZAP API scan (active) against an ephemeral lab
# Third-party actions and images are pinned to release tags; pin to commit SHAs for production use.
name: secure-pipeline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"          # 01:00 UTC = 04:00 Nairobi
  workflow_dispatch:

permissions:
  contents: read
  security-events: write         # upload SARIF to GitHub code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0         # scan the whole history, not just the last commit
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            "git config --global --add safe.directory /repo && gitleaks git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --verbose"

  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep bandit
      - name: Custom rule self-test
        run: semgrep --test --config .semgrep/sil-rules.yml .semgrep/sil-rules.py
      - name: Semgrep (registry rules + SIL custom rules)
        run: |
          semgrep scan --metrics=off --error \
            --config p/python --config p/owasp-top-ten --config .semgrep/sil-rules.yml \
            --sarif --output semgrep.sarif lab/ scripts/
      - name: Upload Semgrep results to code scanning
        if: always()
        continue-on-error: true   # needs a public repo or GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: semgrep.sarif
      - name: Bandit
        run: bandit -ll -r lab scripts

  sca:
    name: SCA, hallucinated packages, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Do the dependencies exist, and are they old enough to trust?
        run: python scripts/check_packages_exist.py lab/apis/*/requirements.txt lab/ai-gateway/requirements*.txt tests/requirements.txt
      - name: Known vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          for r in lab/apis/*/requirements.txt lab/ai-gateway/requirements.txt tests/requirements.txt; do
            echo "== $r"; pip-audit --requirement "$r" --strict
          done
      - name: Trivy filesystem scan (dependencies, Dockerfiles, compose, secrets)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /src/.semgrep --skip-dirs /src/tests /src
      - name: SBOM (CycloneDX)
        if: always()
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs --format cyclonedx --output /src/sbom.cdx.json /src
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json

  unit:
    name: Unit tests (auth + guardrails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: |
          pip install -r lab/apis/patients/requirements.txt -r lab/ai-gateway/requirements.txt -r tests/requirements.txt
          python -m spacy download en_core_web_sm
      - run: SPACY_MODEL=en_core_web_sm pytest tests/unit -q

  dast:
    name: Integration tests + DAST (ZAP)
    needs: [secrets, sast, sca, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start the lab (light AI image, mock model, no Wazuh/Ollama)
        run: |
          cp lab/.env.ci lab/.env
          scripts/lab_up.sh waf kong patients-api appointments-api ai-gateway squid
      - name: Integration tests
        run: |
          pip install -r tests/requirements.txt
          pytest tests/integration -q -m "not ratelimit"
      - name: Get a scan token
        run: |
          T=$(scripts/get_token.sh dr.wanjiru)
          echo "::add-mask::$T"
          echo "SCAN_TOKEN=$T" >> "$GITHUB_ENV"

      # ZAP reads the token from ZAP_AUTH_HEADER_VALUE and adds it to every request.
      # Pull requests: passive baseline THROUGH the WAF and gateway (about 2 minutes, sends no attacks).
      - name: ZAP baseline through the WAF (passive)
        run: |
          chmod a+w .
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER_VALUE="Bearer $SCAN_TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080/api/v1/patients -c .zap/rules.tsv -I \
            -r report_baseline.html -J report_baseline.json

      # main + nightly: ACTIVE scans straight at each API on the lab's internal network.
      # Why not through the gateway: Kong's 60/min limit would throttle the scanner and the WAF would
      # hide whether the code itself is injectable. The baseline above tests the shield; this tests the code.
      - name: ZAP API scans direct to the services (active)
        if: github.event_name != 'pull_request'
        run: |
          for svc in patients appointments; do
            docker run --rm --network sil-lab_internal -v "$PWD:/zap/wrk:rw" \
              -e ZAP_AUTH_HEADER_VALUE="Bearer $SCAN_TOKEN" \
              ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
              -t "http://$svc-api:8000/api/v1/$svc/openapi.json" -f openapi -c .zap/rules.tsv -I \
              -r "report_api_$svc.html" -J "report_api_$svc.json"
          done

      - name: Collect logs for the evidence pack
        if: always()
        run: |
          cd lab && docker compose logs --no-color > ../compose.log 2>&1 || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dast-evidence
          path: |
            report_*.html
            report_*.json
            compose.log
            lab/logs/
