<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" width="1600" height="470" font-family="Inter, DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="a-token" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="a-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
<marker id="a-log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
<marker id="a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
</defs>
<rect width="1600" height="470" fill="#FFFFFF"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#0F172A">Onboarding a new log source into Wazuh: the Squid egress proxy (Shadow AI)</text>
<rect x="30" y="260" width="1540" height="190" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="42" y="280" font-size="12.5" font-weight="700" fill="#475569">Same pattern used for the other sources in this lab</text>
<polyline points="260,155 290,155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-solid)"/>
<polyline points="520,155 550,155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-solid)"/>
<polyline points="780,155 810,155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-solid)"/>
<polyline points="1040,155 1070,155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-solid)"/>
<polyline points="1300,155 1330,155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-solid)"/>
<rect x="30" y="90" width="230" height="130" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.8"/>
<text x="145.0" y="136.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">1 Emit structured</text>
<text x="145.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#334155">Squid logformat 'siljson'</text>
<text x="145.0" y="170.0" text-anchor="middle" font-size="11.5" fill="#334155">one JSON object per line</text>
<text x="145.0" y="187.0" text-anchor="middle" font-size="11.5" fill="#334155">(no custom decoder needed)</text>
<rect x="290" y="90" width="230" height="130" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/>
<text x="405.0" y="136.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">2 Collect</text>
<text x="405.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#334155">file mounted read-only</text>
<text x="405.0" y="170.0" text-anchor="middle" font-size="11.5" fill="#334155">/var/log/sil/squid/access.json</text>
<text x="405.0" y="187.0" text-anchor="middle" font-size="11.5" fill="#334155">&lt;localfile&gt; log_format json</text>
<rect x="550" y="90" width="230" height="130" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="665.0" y="136.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">3 Decode</text>
<text x="665.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#334155">built-in JSON decoder</text>
<text x="665.0" y="170.0" text-anchor="middle" font-size="11.5" fill="#334155">fields: src_ip, url, action,</text>
<text x="665.0" y="187.0" text-anchor="middle" font-size="11.5" fill="#334155">status, dest_host</text>
<rect x="810" y="90" width="230" height="130" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.8"/>
<text x="925.0" y="136.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">4 Detect</text>
<text x="925.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#334155">100100 any Squid event (3)</text>
<text x="925.0" y="170.0" text-anchor="middle" font-size="11.5" fill="#334155">100101 consumer AI host (10)</text>
<text x="925.0" y="187.0" text-anchor="middle" font-size="11.5" fill="#334155">100102 10 in 10 min (12)</text>
<rect x="1070" y="90" width="230" height="130" rx="8" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.8"/>
<text x="1185.0" y="136.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">5 Test</text>
<text x="1185.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#334155">wazuh-logtest with</text>
<text x="1185.0" y="170.0" text-anchor="middle" font-size="11.5" fill="#334155">siem/sample-logs/squid.json</text>
<text x="1185.0" y="187.0" text-anchor="middle" font-size="11.5" fill="#334155">evidence 11</text>
<rect x="1330" y="90" width="230" height="130" rx="8" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.8"/>
<text x="1445.0" y="136.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">6 Operate</text>
<text x="1445.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#334155">dashboard + alert routing</text>
<text x="1445.0" y="170.0" text-anchor="middle" font-size="11.5" fill="#334155">runbook: who, what, why</text>
<text x="1445.0" y="187.0" text-anchor="middle" font-size="11.5" fill="#334155">evidence 13, 14</text>
<text x="50" y="302" text-anchor="start" font-size="12" font-weight="700" fill="#0F172A">Source</text>
<text x="330" y="302" text-anchor="start" font-size="12" font-weight="700" fill="#0F172A">How it arrives</text>
<text x="900" y="302" text-anchor="start" font-size="12" font-weight="700" fill="#0F172A">Rules</text>
<text x="50" y="340" text-anchor="start" font-size="12" font-weight="600" fill="#334155">AI guardrail gateway</text>
<text x="330" y="340" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">JSON decision line (hash, counts, reason)</text>
<text x="900" y="340" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">100110-100113 PHI / secret / injection blocks</text>
<text x="50" y="370" text-anchor="start" font-size="12" font-weight="600" fill="#334155">WAF (ModSecurity v3)</text>
<text x="330" y="370" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">JSON audit log, parts A F H K Z (no bodies, no headers)</text>
<text x="900" y="370" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">100120-100121 blocks and sustained attack</text>
<text x="50" y="400" text-anchor="start" font-size="12" font-weight="600" fill="#334155">Windows endpoint</text>
<text x="330" y="400" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">Wazuh agent: Sysmon channel + real-time FIM</text>
<text x="900" y="400" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">100200-100202 mass file change, .locked, shadow-copy deletion</text>
<text x="50" y="430" text-anchor="start" font-size="12" font-weight="600" fill="#334155">API gateway (Kong)</text>
<text x="330" y="430" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">file-log plugin, JSON per request</text>
<text x="900" y="430" text-anchor="start" font-size="12" font-weight="normal" fill="#334155">context for investigations (request ID ties WAF, Kong, API)</text>
</svg>